[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "agentic-rtl-platform"
version = "0.1.0"
description = "Evidence-driven multi-agent RTL generation and verification research platform"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Parin Mistry"}]
dependencies = [
  "pydantic>=2.8,<3",
  "typer>=0.12,<1",
  "rich>=13.7,<14",
  "jinja2>=3.1,<4"
]

[project.optional-dependencies]
dev = ["pytest>=8.2,<9", "ruff>=0.5,<1", "mypy>=1.10,<2"]
verification = ["cocotb>=1.9,<2"]
mcp = ["mcp>=1.0,<2"]

[project.scripts]
agentic-rtl = "agentic_rtl.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_rtl"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true
