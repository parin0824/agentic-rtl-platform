name: ci

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e '.[dev]'
      - run: ruff check src tests
      - run: pytest -q

  rtl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y verilator yosys
      - run: verilator --lint-only --Wall --Wno-fatal --top-module async_fifo rtl/async_fifo/async_fifo.sv
      - run: yosys -q -p 'read_verilog -sv rtl/async_fifo/async_fifo.sv; hierarchy -top async_fifo; proc; check'
